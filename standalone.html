  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 1. DATA: 64 Types Generator
    const mbtiData = {
      INTJ: { baseName: "전략가 (Mastermind)", core: "통찰력과 독립적 사고를 지닌 비전 설계자", domain: "전략적 분석 및 시스템 구축" },
      INTP: { baseName: "논리학자 (Logician)", core: "끝없는 지적 호기심과 정밀한 분석의 탐구자", domain: "원리 규명 및 이론 모델링" },
      ENTJ: { baseName: "통솔자 (Commander)", core: "대담한 비전과 거침없는 실행의 총사령관", domain: "조직 통솔 및 대규모 목표 달성" },
      ENTP: { baseName: "변론가 (Debater)", core: "기민한 두뇌와 재치로 통념에 도전하는 혁신가", domain: "새로운 패러다임 개척 및 브레인스토밍" },
      INFJ: { baseName: "옹호자 (Advocate)", core: "깊은 통찰력과 확고한 가치관을 지닌 선구자", domain: "인간 본질 이해 및 영감 부여" },
      INFP: { baseName: "중재자 (Mediator)", core: "진정성과 이상을 추구하는 사려 깊은 치유자", domain: "감성적 가치 창출 및 개인의 잠재력 지지" },
      ENFJ: { baseName: "선도자 (Protagonist)", core: "사람들의 마음을 움직이고 잠재력을 꽃피우는 조력자", domain: "공동체 결속 및 동기 부여 리더십" },

      ISFJ: { baseName: "수호자 (Defender)", core: "헌신과 온기로 묵묵히 곁을 지키는 든든한 보호자", domain: "세심한 실무 지원 및 관계 안정화" },
      ESTJ: { baseName: "경영자 (Executive)", core: "탁월한 질서와 현실적 규율로 성과를 이끄는 관리자", domain: "자원 조직화 및 결과 지향 프로젝트 지휘" },
      ESFJ: { baseName: "집정관 (Consul)", core: "따뜻한 배려와 친화력으로 사람들을 잇는 허브", domain: "팀 분위기 조율 및 네트워크 활성화" },
      ISTP: { baseName: "장인 (Virtuoso)", core: "냉철한 관찰과 손끝의 기술로 문제를 해결하는 만능 해결사", domain: "즉각적인 기술적 문제해결 및 메커니즘 조작" },
      ISFP: { baseName: "모험가 (Adventurer)", core: "순간의 아름다움과 개성을 오롯이 표현하는 예술가", domain: "심미적 조형 및 감각적 경험 설계" },
      ESTP: { baseName: "사업가 (Entrepreneur)", core: "위험을 두려워하지 않고 현장에서 즉각 승부를 보는 행동파", domain: "위기 돌파 및 기회 포착 액션" },
      ESFP: { baseName: "연예인 (Entertainer)", core: "생동감 넘치는 매력으로 주변을 축제로 만드는 분위기 메이커", domain: "현장 에너지 극대화 및 공감대 형성" }
    };

    const dcnhData = {
      D: { name: "주도형 (Dominant)", role: "결단과 지휘, 목표 돌파", color: "#FF4D4D", workStyle: "빠른 의사결정과 공격적인 목표 달성을 추구합니다.", subTrait: "방향이 흐려질 때 주저 없이 지휘권을 쥐고 장애물을 뚫고 나아갑니다." },
      C: { name: "창의형 (Creative)", role: "새로운 가능성 발굴과 즉흥적 실험", color: "#FFE600", workStyle: "정형화된 틀을 깨고 예상치 못한 창의적 접근법을 모색합니다.", subTrait: "호기심을 자극하는 새로운 프로젝트에서 가장 빛을 발하며 기발한 아이디어를 쏟아냅니다." },
      N: { name: "체계형 (Normalizing)", role: "규칙 수립, 품질 완결, 프로세스 표준화", color: "#2563EB", workStyle: "세부적인 디테일과 일관성 있는 절차를 통해 완성도를 극대화합니다.", subTrait: "감정 기복 없이 철저한 점검과 시스템화를 통해 오류 없는 결과를 만듭니다." },
      H: { name: "조화형 (Harmonizing)", role: "갈등 중재, 심리적 안정, 유연한 협업", color: "#00D084", workStyle: "구성원들의 마음을 보듬고 환경에 부드럽게 적응하며 평화를 유지합니다.", subTrait: "대립하는 의견들 사이에서 균형점을 찾아내고 구성원 모두가 편안한 환경을 조성합니다." }
    };

    const typeCatalog = {};
    Object.entries(mbtiData).forEach(([mbti, mInfo]) => {
      ['D', 'C', 'N', 'H'].forEach(sub => {
        const dInfo = dcnhData[sub];
        const code = `${mbti}-${sub}`;
        let title = "", slogan = "", strengths = [], risks = [], synergy = "";

        if (sub === 'D') {
          title = `행동력으로 비전을 관철하는 ${mInfo.baseName}`;
          slogan = `“생각을 머뭇거리지 않고 즉각적인 행동과 결과로 증명한다.”`;
          strengths = ["신속한 위기 돌파력과 목표 추진력", "명확한 우선순위 설정 및 결단력", "주변을 강하게 이끄는 주도적 에너지"];
          risks = ["속도를 중시하다 팀원의 피로도나 정서적 반응을 간과할 위험", "타인의 신중한 의견을 답답하게 여길 수 있음"];
          synergy = "체계형(N)의 꼼꼼한 백업과 조화형(H)의 완충 지원이 있을 때 최상의 시너지를 냅니다.";
        } else if (sub === 'C') {
          title = `기존 틀을 깨는 실험적 ${mInfo.baseName}`;
          slogan = `“정답은 하나가 아니다. 세상에 없던 새로운 길을 만든다.”`;
          strengths = ["파격적인 발상 전환과 독창적 아이디어 창출", "위기 상황에서의 임기응변과 유연한 적응력", "호기심과 지적 자극을 통한 주변 영감 고취"];
          risks = ["새로운 시작은 빠르나 지루한 반복 뒷정리에 소홀해질 수 있음", "기존 규범이나 정해진 절차를 건너뛰려는 경향"];
          synergy = "주도형(D)이 실행을 결단해주고 체계형(N)이 뒷수습 및 표준화를 맡아줄 때 혁신이 완성됩니다.";
        } else if (sub === 'N') {
          title = `원칙과 무결성을 수호하는 정밀 ${mInfo.baseName}`;
          slogan = `“완벽한 디테일과 견고한 시스템이 최고의 결과를 보장한다.”`;
          strengths = ["탁월한 품질 관리와 오차 없는 세부 분석력", "한결같은 신뢰성과 높은 약속 이행률", "복잡한 구조를 일목요연하게 정리하는 표준화 능력"];
          risks = ["지나친 완벽주의로 인해 의사결정이 지연될 수 있음", "예상치 못한 급격한 변화나 모호한 상황에 스트레스"];
          synergy = "창의형(C)의 번뜩이는 아이디어를 현실적 제도로 안착시키고, 주도형(D)의 속도를 안정적으로 통제합니다.";
        } else if (sub === 'H') {
          title = `사람과 균형을 연결하는 현자형 ${mInfo.baseName}`;
          slogan = `“모두가 화합하고 안정을 찾을 때 진정한 시너지가 일어난다.”`;
          strengths = ["탁월한 공감 능력과 심리적 완충 지대 역할", "어떤 환경에도 부드럽게 스며드는 유연한 적응력", "숨겨진 갈등을 조용히 치유하는 따뜻한 서포트"];
          risks = ["자신의 솔직한 욕구나 주장을 억누르다 속앓이를 할 수 있음", "갈등을 피하려다 단호한 결단을 내려야 할 시기를 놓칠 위험"];
          synergy = "추진력이 강한 주도형(D)의 마찰을 줄여주고, 정밀한 체계형(N)에게 유연한 쉼표를 제공합니다.";
        }

        typeCatalog[code] = {
          code, mbti, dcnh: sub, dcnhTitle: dInfo.name, baseName: mInfo.baseName,
          title, slogan, color: dInfo.color,
          badge: `${mInfo.baseName.split(' ')[0]} × ${dInfo.name.split(' ')[0]}`,
          summary: `${mInfo.core}인 ${mbti}의 본질 위에, ${dInfo.subTrait}`,
          domain: mInfo.domain, workStyle: dInfo.workStyle, strengths, risks, synergy,
          advice: `[${code} 성장 가이드] ${dInfo.name}의 성향이 당신의 ${mbti} 역량을 독보적으로 만듭니다. ${risks[0]}에 유의하면 더 탁월한 성과를 창출합니다.`
        };
      });
    });

    // 2. DATA: Questions
    const quickQuestions = [
      { id: "q1", dimension: "EI", positive: "E", text: "주말이나 여가 시간에 사람들과 어울려 활동할 때 에너지를 얻는 편이다.", category: "에너지 방향 (E/I)" },
      { id: "q2", dimension: "EI", positive: "I", text: "복잡한 모임보다는 혼자 조용히 생각하거나 취미에 몰입할 때 피로가 풀린다.", category: "에너지 방향 (E/I)" },
      { id: "q3", dimension: "SN", positive: "S", text: "추상적인 미래 가능성보다 지금 눈앞의 실제 사실과 검증된 데이터에 집중한다.", category: "인식 방식 (S/N)" },
      { id: "q4", dimension: "SN", positive: "N", text: "현실적인 세부사항보다 숨겨진 의미, 새로운 영감과 큰 그림을 상상하는 것을 즐긴다.", category: "인식 방식 (S/N)" },
      { id: "q5", dimension: "TF", positive: "T", text: "중요한 결정을 내릴 때 감정적인 배려보다 논리적 타당성과 효율성을 우선시한다.", category: "판단 기준 (T/F)" },
      { id: "q6", dimension: "TF", positive: "F", text: "논리적 정답보다 관련된 사람들의 감정과 관계의 조화를 더 깊이 살핀다.", category: "판단 기준 (T/F)" },
      { id: "q7", dimension: "JP", positive: "J", text: "일정을 미리 정해두고 체계적으로 하나씩 완수해 나가는 것이 마음 편하다.", category: "생활 양식 (J/P)" },
      { id: "q8", dimension: "JP", positive: "P", text: "상황에 따라 즉흥적으로 대처하고 가능성을 열어두는 유연한 방식을 선호한다.", category: "생활 양식 (J/P)" },
      { id: "q9", dimension: "DCNH", subType: "D", text: "팀이나 프로젝트에서 방향이 모호할 때 망설임 없이 주도권을 쥐고 결단을 내린다.", category: "하위유형 (DCNH)" },
      { id: "q10", dimension: "DCNH", subType: "D", text: "장애물이 생겨도 물러서지 않고 목표를 돌파해 결과를 만들어내는 편이다.", category: "하위유형 (DCNH)" },
      { id: "q11", dimension: "DCNH", subType: "C", text: "기존의 정해진 방식에 얽매이기보다 파격적이고 기발한 새 아이디어를 시도한다.", category: "하위유형 (DCNH)" },
      { id: "q12", dimension: "DCNH", subType: "C", text: "호기심을 끄는 흥미진진한 자극이 생기면 즉각적으로 실험해보고 싶다.", category: "하위유형 (DCNH)" },
      { id: "q13", dimension: "DCNH", subType: "N", text: "규칙, 표준화된 프로세스, 디테일한 정리정돈을 유지하는 것이 업무의 기본이라 여긴다.", category: "하위유형 (DCNH)" },
      { id: "q14", dimension: "DCNH", subType: "N", text: "변덕스러운 행동을 지양하고 언제나 신중하며 예측 가능한 일관성을 보여준다.", category: "하위유형 (DCNH)" },
      { id: "q15", dimension: "DCNH", subType: "H", text: "주변 사람들의 심리적 분위기나 갈등을 민감하게 포착해 중재하고 편안하게 만든다.", category: "하위유형 (DCNH)" },
      { id: "q16", dimension: "DCNH", subType: "H", text: "내 주장을 강요하기보다는 환경에 부드럽게 적응하며 모두의 평화를 지키는 편이다.", category: "하위유형 (DCNH)" }
    ];

    // Scoring Engine
    function calculateScores(responses, questions) {
      const stats = {
        E: { score: 0, count: 0 }, I: { score: 0, count: 0 },
        S: { score: 0, count: 0 }, N: { score: 0, count: 0 },
        T: { score: 0, count: 0 }, F: { score: 0, count: 0 },
        J: { score: 0, count: 0 }, P: { score: 0, count: 0 },
        D: { score: 0, count: 0 }, C: { score: 0, count: 0 },
        Norm: { score: 0, count: 0 }, H: { score: 0, count: 0 }
      };

      questions.forEach((q) => {
        const val = responses[q.id];
        if (val === undefined || val === null) return;

        if (q.dimension === 'EI') {
          if (q.positive === 'E') {
            stats.E.score += val; stats.E.count += 1;
            stats.I.score += (6 - val); stats.I.count += 1;
          } else {
            stats.I.score += val; stats.I.count += 1;
            stats.E.score += (6 - val); stats.E.count += 1;
          }
        } else if (q.dimension === 'SN') {
          if (q.positive === 'S') {
            stats.S.score += val; stats.S.count += 1;
            stats.N.score += (6 - val); stats.N.count += 1;
          } else {
            stats.N.score += val; stats.N.count += 1;
            stats.S.score += (6 - val); stats.S.count += 1;
          }
        } else if (q.dimension === 'TF') {
          if (q.positive === 'T') {
            stats.T.score += val; stats.T.count += 1;
            stats.F.score += (6 - val); stats.F.count += 1;
          } else {
            stats.F.score += val; stats.F.count += 1;
            stats.T.score += (6 - val); stats.T.count += 1;
          }
        } else if (q.dimension === 'JP') {
          if (q.positive === 'J') {
            stats.J.score += val; stats.J.count += 1;
            stats.P.score += (6 - val); stats.P.count += 1;
          } else {
            stats.P.score += val; stats.P.count += 1;
            stats.J.score += (6 - val); stats.J.count += 1;
          }
        } else if (q.dimension === 'DCNH') {
          const sub = q.subType === 'N' ? 'Norm' : q.subType;
          if (stats[sub]) {
            stats[sub].score += val;
            stats[sub].count += 1;
          }
        }
      });

      const calcPairPercent = (posKey, negKey) => {
        const posScore = stats[posKey].score;
        const negScore = stats[negKey].score;
        const total = posScore + negScore;
        if (total === 0) return { posPercent: 50, negPercent: 50 };
        const posPercent = Math.round((posScore / total) * 100);
        return { posPercent, negPercent: 100 - posPercent };
      };

      const ei = calcPairPercent('E', 'I');
      const sn = calcPairPercent('S', 'N');
      const tf = calcPairPercent('T', 'F');
      const jp = calcPairPercent('J', 'P');

      const mbti = [
        ei.posPercent >= 50 ? 'E' : 'I',
        sn.posPercent >= 50 ? 'S' : 'N',
        tf.posPercent >= 50 ? 'T' : 'F',
        jp.posPercent >= 50 ? 'J' : 'P'
      ].join('');

      const calcDcnhAvg = (key) => {
        const item = stats[key];
        if (!item.count) return 50;
        return Math.round(((item.score / item.count - 1) / 4) * 100);
      };

      const dcnhScores = {
        D: calcDcnhAvg('D'),
        C: calcDcnhAvg('C'),
        N: calcDcnhAvg('Norm'),
        H: calcDcnhAvg('H')
      };

      const sortedDcnh = Object.entries(dcnhScores).sort((a, b) => b[1] - a[1]);
      const topSubType = sortedDcnh[0][0];

      const warnings = [];
      if (Math.abs(ei.posPercent - 50) <= 6) warnings.push('외향(E)과 내향(I)의 성향이 균형을 이루고 있습니다.');
      if (Math.abs(sn.posPercent - 50) <= 6) warnings.push('감각(S)과 직관(N)의 균형 상태로, 현실과 이상을 넘나듭니다.');
      if (Math.abs(tf.posPercent - 50) <= 6) warnings.push('사고(T)와 감정(F)의 균형 상태로, 이성과 공감의 조화를 중시합니다.');
      if (Math.abs(jp.posPercent - 50) <= 6) warnings.push('판단(J)과 인식(P)의 유연한 균형으로 계획과 즉흥성을 겸비했습니다.');
      if (sortedDcnh[0][1] - sortedDcnh[1][1] <= 5) {
        warnings.push(`주 하위유형(${sortedDcnh[0][0]})과 차순위(${sortedDcnh[1][0]})의 격차가 미세하여 복합적인 특성을 보입니다.`);
      }

      return {
        code: `${mbti}-${topSubType}`,
        mbti,
        subType: topSubType,
        secondarySubType: sortedDcnh[1][0],
        dimensions: {
          EI: { E: ei.posPercent, I: ei.negPercent },
          SN: { S: sn.posPercent, N: sn.negPercent },
          TF: { T: tf.posPercent, F: tf.negPercent },
          JP: { J: jp.posPercent, P: jp.negPercent }
        },
        dcnhScores,
        sortedDcnh,
        warnings,
        answeredCount: Object.keys(responses).length,
        totalQuestions: questions.length
      };
    }

                      title="입력한 질문 내용 지우기"
                    >
                      <span className="font-bold">🔄 입력 비우기</span>
                    </button>
                  </div>
                  <textarea
                    value={advisorQuestion}
                    onChange={(e) => setAdvisorQuestion(e.target.value)}
                    placeholder="예: 새로운 팀 프로젝트에서 동료와 갈등이 생겼는데, 제 성향상 어떻게 소통해야 원만하게 성과를 낼 수 있을까요?"
                    rows={4}
                    className="w-full p-3 border-2 border-black bg-gray-50 focus:bg-white text-sm font-medium outline-none shadow-[3px_3px_0px_#000]"
                  />

                  {/* Sample Chips */}
                  <div className="space-y-1">
                    <span className="text-xs font-black text-gray-600">자주 묻는 질문 템플릿:</span>
                    <div className="flex flex-wrap gap-1.5">
                      {[
                        "새 프로젝트에서 팀원들과 소통 방식을 어떻게 잡아야 할까요?",
                        "상대방과 의견 충돌이 났을 때 제 성향상 최선의 조율법은?",
                        "최근 번아웃이 왔습니다. 제 유형에 맞는 회복 루틴은?",
                        "진로 결정을 앞두고 어떤 기준을 우선 삼아야 할까요?"
                      ].map((sq, i) => (
                        <button
                          key={i}
                          type="button"
                          onClick={() => setAdvisorQuestion(sq)}
                          className="text-xs bg-gray-100 hover:bg-yellow-100 border border-black px-2 py-1 text-left font-medium cursor-pointer"
                        >
                          "{sq}"
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Gemini API Key */}
                  <div className="border-t-2 border-black pt-3">
                    <button
                      type="button"
                      onClick={() => setShowApiKey(!showApiKey)}
                      className="text-xs font-bold text-gray-600 flex items-center gap-1 hover:text-black cursor-pointer"
                    >
                      <span>🔑 Google Gemini 실시간 AI 엔진 연동 설정 (선택 사항)</span>
                      <span>{showApiKey ? '▲' : '▼'}</span>
                    </button>
                    {showApiKey && (
                      <div className="mt-2 p-3 bg-gray-50 border border-black text-xs space-y-2">
                        <p className="text-gray-600">
                          API Key가 없어도 내장된 <strong>지능형 64유형 규칙 엔진</strong>이 즉시 정밀 솔루션을 생성합니다. 직접 키를 입력하시면 Google Gemini AI가 실시간 분석합니다.
                        </p>
                        <input
                          type="password"
                          value={advisorApiKey}
                          onChange={(e) => setAdvisorApiKey(e.target.value)}
                          placeholder="Google Gemini API Key 입력..."
                          className="w-full p-2 border border-black bg-white text-xs font-mono"
                        />
                      </div>
                    )}
                  </div>

                  {/* 분석 및 상시 표시 초기화 버튼 그룹 */}
                  <div className="flex flex-wrap items-center gap-3 pt-1">
                    <button
                      onClick={handleRunAdvisor}
                      disabled={advisorLoading}
                      className="flex-1 min-w-[200px] brutal-btn bg-[#FF4D4D] text-white py-3 text-sm md:text-base font-black flex items-center justify-center gap-2 cursor-pointer shadow-[4px_4px_0px_#000]"
                    >
                      {advisorLoading ? "심층 솔루션 분석 중..." : "성향 맞춤 솔루션 분석받기 ➔"}
                    </button>
                    <button
                      type="button"
                      onClick={handleResetAdvisor}
                      title="질문 내용 및 분석 결과 모두 초기화"
                      className="brutal-btn bg-white hover:bg-gray-100 text-black px-5 py-3 text-sm font-black flex items-center gap-1.5 cursor-pointer shadow-[3px_3px_0px_#000]"
                    >
                      <span className="text-red-600 text-base font-bold">🔄</span>
                      <span>전체 초기화</span>
                    </button>
                  </div>
                </div>

                {/* Advisor Result */}
                {advisorResult && (
                  <div className="brutal-card-lg bg-white p-6 space-y-4 border-4 border-black">
                    <div className="flex flex-wrap justify-between items-center border-b-2 border-black pb-3 gap-2">
                      <div className="flex items-center gap-2">
                        <span className="brutal-tag bg-[#FFE600] text-xs px-2.5 py-1">솔루션 리포트</span>
                        <h3 className="font-black text-base">[{result?.code || 'INTJ-C'}] 맞춤형 성향 처방전</h3>
                      </div>
                      <div className="flex items-center gap-2">
                        <button
                          onClick={handleResetAdvisor}
                          className="brutal-btn bg-white hover:bg-red-50 px-2.5 py-1 text-xs cursor-pointer text-red-600"
                          title="기존 결과를 지우고 새로운 질문 작성하기"
                        >
                          🔄 새 질문 (초기화)
                        </button>
                        <button
                          onClick={() => {
                            navigator.clipboard.writeText(advisorResult.content);
                            setCopied(true);
                            setTimeout(() => setCopied(false), 2000);
                          }}
                          className="brutal-btn bg-white px-2.5 py-1 text-xs cursor-pointer"
                        >
                          {copied ? '복사됨 ✓' : '결과 복사'}
                        </button>
                      </div>
                    </div>
                    <div className="text-xs md:text-sm text-gray-800 leading-relaxed whitespace-pre-line bg-[#FFFDF0] p-4 border-2 border-black font-sans">
                      {advisorResult.content}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* TAB: CATALOG */}
            {activeTab === 'catalog' && (
              <div className="max-w-5xl mx-auto space-y-6 pb-8">
                <div className="brutal-card bg-black text-white p-4">
                  <div className="flex justify-between items-center border-b-2 border-white pb-2 mb-2">
                    <h2 className="text-lg font-black text-[#FFE600]">64가지 세분화 성격 유형 백과 (CATALOG)</h2>
                    <span className="text-xs font-mono font-bold bg-[#FFE600] text-black px-2 py-0.5">총 64개</span>
                  </div>
                  <p className="text-xs text-gray-300">
                    기본 16가지 MBTI에 DCNH 4대 하위유형(주도형 D, 창의형 C, 체계형 N, 조화형 H)이 결합된 모든 세분화 유형을 탐색하세요.
                  </p>
                </div>

                {/* Filters */}
                <div className="brutal-card bg-white p-4 space-y-3">
                  <input
                    type="text"
                    value={catalogSearch}
                    onChange={(e) => setCatalogSearch(e.target.value)}
                    placeholder="유형 코드(예: INTJ-C), 직함, 키워드로 검색..."
                    className="w-full p-2 border-2 border-black text-xs font-bold outline-none"
                  />
                  <div className="flex flex-wrap items-center gap-1.5">
                    <span className="text-xs font-black mr-2">DCNH:</span>
                    {[
                      { id: 'ALL', label: '전체' },
                      { id: 'D', label: '주도형 (D)', bg: 'bg-[#FF4D4D] text-white' },
                      { id: 'C', label: '창의형 (C)', bg: 'bg-[#FFE600] text-black' },
                      { id: 'N', label: '체계형 (N)', bg: 'bg-[#2563EB] text-white' },
                      { id: 'H', label: '조화형 (H)', bg: 'bg-[#00D084] text-black' }
                    ].map(d => (
                      <button
                        key={d.id}
                        onClick={() => setCatalogDcnh(d.id)}
                        className={`px-2 py-0.5 text-xs font-black border border-black cursor-pointer ${catalogDcnh === d.id ? `${d.bg || 'bg-black text-white'} shadow-[2px_2px_0px_#000]` : 'bg-white text-gray-700'}`}
                      >
                        {d.label}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Grid */}
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {Object.values(typeCatalog)
                    .filter(t => {
                      const matchSearch = t.code.toLowerCase().includes(catalogSearch.toLowerCase()) || t.title.toLowerCase().includes(catalogSearch.toLowerCase());
                      const matchDcnh = catalogDcnh === 'ALL' || t.dcnh === catalogDcnh;
                      return matchSearch && matchDcnh;
                    })
                    .map(item => (
                      <div
                        key={item.code}
                        onClick={() => setCatalogModal(item)}
                        className="brutal-card bg-white p-4 flex flex-col justify-between cursor-pointer hover:translate-y-[-2px] transition-transform min-h-[320px] h-full"
                      >
                        <div>
                          <div className="flex justify-between items-center border-b-2 border-black pb-2 mb-2">
                            <span className="text-xl font-black">{item.code}</span>
                            <span className="text-xs font-black px-2 py-0.5 border border-black bg-yellow-200">
                              {item.dcnhTitle.split(' ')[0]}
                            </span>
                          </div>
                          <h4 className="font-extrabold text-sm text-black leading-snug break-keep">{item.title}</h4>
                          <p className="text-xs text-gray-500 font-bold mt-1 italic">{item.slogan}</p>
                          <div className="text-xs text-gray-800 mt-3 bg-gray-50 p-2.5 border-2 border-black leading-relaxed break-keep">
                            {item.summary}
                          </div>
                        </div>
                        <div className="pt-3 border-t-2 border-black mt-3 text-xs font-bold flex justify-between items-center">
                          <span className="bg-black text-white px-1.5 py-0.5 text-[11px]">{item.baseName.split(' ')[0]}</span>
                          <span className="font-black underline text-black">자세히 보기 ➔</span>
                        </div>
                      </div>
                    ))}
                </div>

                {/* Modal */}
                {catalogModal && (
                  <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
                    <div className="brutal-card-lg bg-white max-w-lg w-full p-6 space-y-4 max-h-[85vh] overflow-y-auto">
                      <div className="flex justify-between items-center border-b-2 border-black pb-2">
                        <span className="text-2xl font-black">{catalogModal.code}</span>
                        <button onClick={() => setCatalogModal(null)} className="brutal-btn px-2 py-0.5 font-black bg-white cursor-pointer">X</button>
                      </div>
                      <h3 className="text-lg font-black">{catalogModal.title}</h3>
                      <p className="text-xs font-bold text-gray-500 italic">{catalogModal.slogan}</p>
                      <div className="bg-[#FFFDF0] p-3 border-2 border-black text-xs leading-relaxed">
                        {catalogModal.summary}
                      </div>
                      <div className="grid grid-cols-2 gap-2 text-xs">
                        <div className="bg-emerald-50 border border-black p-2">
                          <span className="font-black text-emerald-900 block mb-1">핵심 강점</span>
                          <ul className="space-y-0.5 text-gray-700">
                            {catalogModal.strengths?.map((s, i) => <li key={i}>✓ {s}</li>)}
                          </ul>
                        </div>
                        <div className="bg-red-50 border border-black p-2">
                          <span className="font-black text-red-900 block mb-1">주의할 점</span>
                          <ul className="space-y-0.5 text-gray-700">
                            {catalogModal.risks?.map((r, i) => <li key={i}>! {r}</li>)}
                          </ul>
                        </div>
                      </div>
                      <div className="bg-blue-50 border border-black p-2 text-xs">
                        <span className="font-black text-blue-900 block mb-0.5">협업 시너지</span>
                        <p className="text-gray-700">{catalogModal.synergy}</p>
                      </div>
                      <button onClick={() => setCatalogModal(null)} className="w-full brutal-btn bg-black text-white py-1.5 text-xs font-bold cursor-pointer">
                        닫기
                      </button>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* FOOTER */}
            <footer className="mt-8 brutal-card bg-white p-4 text-center text-xs space-y-1">
              <div className="font-mono font-bold">64-MBTI DIAGNOSTIC ENGINE • NEO-BRUTALISM UI</div>
              <p className="text-gray-500 text-[11px]">* MBTI 16가지 성향과 소시오닉스 DCNH 4대 하위유형을 결합한 인터랙티브 자기이해 웹 애플리케이션입니다.</p>
            </footer>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
